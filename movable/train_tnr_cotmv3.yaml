# TNR / anti-Yes-bias mix for 0-shot Triad finetune.
# Base CoTM + InstructIAD, plus extra copies of No / normal answers.
# Intentionally does NOT include musc_v0 eval FPs (would leak MVTec test).
datasets:
  - json_path: /home/yz/code/Triad-main/movable/CoTM/CoTM_v3.json
    sampling_strategy: all
  # Extra 2x CoTM No answers → those samples appear ~3x overall
  - json_path: /home/yz/code/Triad-main/movable/CoTM/CoTM_v3_no.json
    sampling_strategy: repeat:2
  - json_path: /home/yz/code/Triad-main/movable/InstructIAD/InstructIAD.json
    sampling_strategy: all
  # Extra 1x InstructIAD normals → normals ~2x overall
  - json_path: /home/yz/code/Triad-main/movable/InstructIAD/InstructIAD_normal.json
    sampling_strategy: repeat:1
